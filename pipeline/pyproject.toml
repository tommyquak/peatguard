[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peatguard"
version = "0.5.0"
description = "NISAR L-band radar ingest, time-series and validation tools for tropical peatland restoration monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tommy Quak"}]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",
    "h5py>=3.10.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "asf_search>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]
gcs = [
    "google-cloud-storage>=2.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peatguard = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
